[project]
name = "note-detector"
version = "0.1.0"
description = "RunPod serverless worker: Note detection, vocal separation, Vocal notes and Pitch curve"
requires-python = ">=3.12,<3.13"
# The API reaches the worker only through RunPod: nothing imports this
# package, so it is an application, not a library, and is never installed.
dependencies = [
  "numpy>=1.26",
  "requests>=2.32",
  "runpod>=1.12",
]

[dependency-groups]
# The model stack, installed in the GPU image and on Linux machines that run
# the worker for real. Not needed by the tests or the linter.
model = [
  "einops>=0.8",
  "pyyaml>=6.0",
  "rotary-embedding-torch>=0.6.1,<0.7",
  "onnxruntime-gpu>=1.27,<1.28",
  "scipy>=1.13",
  "soundfile>=0.13",
  # Both PyPI release lines target CUDA 13 and cuDNN 9. Keep their major
  # CUDA versions aligned so ONNX Runtime can reuse torch's GPU libraries.
  # Restrict release lines to avoid upgrading the model stack implicitly.
  "torch>=2.11,<2.12",
]
# Only for the separation parity test: the reference separator it compares
# against. Not installed in the image.
parity-separation = [
  "audio-separator>=0.35",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.12",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 80
target-version = "py312"

# Vendored third-party code keeps its upstream style.
extend-exclude = ["note_detector/vendor"]

[tool.ruff.lint]
# The repo's limits, as Ruff enforces them: cyclomatic complexity 15, 4
# arguments and 50 statements per function, and pep8 naming. Ruff has no
# lines-per-function rule, so statements is the closest limit it can check.
select = ["E", "F", "I", "B", "UP", "C90", "N", "PLR0913", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 4
max-statements = 50

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "rmvpe: needs the RMVPE weights (RMVPE_WEIGHTS or /app/weights/rmvpe.pt); skipped without them",
  "parity: compares a model adapter with its reference; runs only when the weights are present",
]

[tool.coverage.report]
# The measured modules are at 100% today; this is the ratchet, so any new
# uncovered line in them fails the run.
fail_under = 100

[tool.coverage.run]
source = ["note_detector"]
# The glue around the model stack (torch, onnxruntime, RunPod) only runs on
# the GPU image; the tests cover the pure logic and the contract around it.
omit = [
  "note_detector/__main__.py",
  "note_detector/rmvpe.py",
  "note_detector/game.py",
  "note_detector/vendor/*",
  "note_detector/separation.py",
]
