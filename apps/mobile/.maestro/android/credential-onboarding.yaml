appId: com.vozzify.app.preview
---
- launchApp:
    clearState: true
    permissions:
      notifications: unset
- tapOn:
    id: open-components
- tapOn:
    id: language-en
- scrollUntilVisible:
    element:
      id: appearance-light
    direction: DOWN
- tapOn:
    id: appearance-light
- scrollUntilVisible:
    element:
      id: gallery-sign-in-overlay
    direction: DOWN
- tapOn:
    id: gallery-sign-in-overlay
- tapOn:
    id: sign-in-identifier
- inputText: ${AUTH_EMAIL}
- tapOn:
    id: auth-password
- inputText: ${AUTH_PASSWORD}
- hideKeyboard
- tapOn:
    id: submit-sign-in
- extendedWaitUntil:
    visible: Choose your Username
    timeout: 15000
- stopApp
- launchApp:
    permissions: {}
- extendedWaitUntil:
    visible: Choose your Username
    timeout: 15000
- tapOn:
    id: setup-username-input
- inputText: ${AUTH_USERNAME}
- hideKeyboard
- extendedWaitUntil:
    visible: Username available
    timeout: 15000
- takeScreenshot: setup-username-light
- assertNotVisible:
    id: .*:id/permission_deny_button
- tapOn:
    id: submit-username
- extendedWaitUntil:
    visible:
      id: .*:id/permission_deny_button
    timeout: 15000
- takeScreenshot: notification-permission
- tapOn:
    id: .*:id/permission_deny_button
- extendedWaitUntil:
    visible: A native overlay
    timeout: 15000
- tapOn:
    id: overlay-dismiss
- assertNotVisible: A native overlay
- scrollUntilVisible:
    element:
      id: return-home
    direction: DOWN
- tapOn:
    id: return-home
- assertVisible: Signed in as @${AUTH_USERNAME}
- stopApp
- launchApp:
    permissions: {}
- assertVisible: Signed in as @${AUTH_USERNAME}
- assertNotVisible:
    id: .*:id/permission_deny_button
- tapOn:
    id: open-components
- assertVisible: Foundation components
- assertNotVisible: A native overlay
