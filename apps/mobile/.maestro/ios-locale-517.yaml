appId: com.vozzify.app
---
- launchApp
- assertVisible: "Welcome to Vozzify"
- tapOn:
    id: open-components
- assertVisible: "Foundation components"
- assertVisible:
    id: language-en
    text: "radio button, checked"
- assertVisible:
    id: language-pt-BR
    text: "radio button, unchecked"
- tapOn:
    id: language-pt-BR
- assertVisible: "Componentes da base"
- assertVisible: "Idioma"
- assertVisible:
    id: language-pt-BR
    text: "radio button, checked"
- assertVisible:
    id: language-en
    text: "radio button, unchecked"
- takeScreenshot: ios-locale-pt-br-selection
- tapOn: "Abrir sobreposição"
- assertVisible: "Uma sobreposição nativa"
- assertVisible: "Este elemento usa a mesma paleta e os mesmos cantos arredondados do app."
- takeScreenshot: ios-locale-pt-br-overlay
- tapOn: "Fechar sobreposição"
- stopApp
- launchApp
- assertVisible: "Boas-vindas ao Vozzify"
- tapOn:
    id: open-components
- assertVisible: "Componentes da base"
- assertVisible:
    id: language-pt-BR
    text: "radio button, checked"
- assertVisible:
    id: language-en
    text: "radio button, unchecked"
- takeScreenshot: ios-locale-pt-br-restored
- tapOn:
    id: language-en
- assertVisible: "Foundation components"
- assertVisible:
    id: language-en
    text: "radio button, checked"
- assertVisible:
    id: language-pt-BR
    text: "radio button, unchecked"
- takeScreenshot: ios-locale-en-selection
- tapOn: "Open overlay"
- assertVisible: "A native overlay"
- assertVisible: "This surface uses the same palette and rounded shapes as the app."
- takeScreenshot: ios-locale-en-overlay
