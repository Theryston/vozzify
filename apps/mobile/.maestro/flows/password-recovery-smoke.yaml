appId: com.vozzify.app.preview
---
- launchApp:
    clearState: true
- tapOn:
    id: open-components
- tapOn:
    id: language-en
- scrollUntilVisible:
    element:
      id: appearance-light
    direction: DOWN
- tapOn:
    id: appearance-light
- openLink: vozzify-preview://sign-in
- runFlow: ../helpers/confirm-ios-app-link.yaml
- scrollUntilVisible:
    element:
      text: 'Forgot your password.*'
    direction: DOWN
- tapOn:
    text: 'Forgot your password.*'
- assertVisible: Reset your password
- tapOn:
    id: submit-forgot-password
- assertVisible: Enter a valid email address.
- takeScreenshot: forgot-password-light
- openLink: 'vozzify-preview://forgot-password/reset?email=recovery%40example.test'
- runFlow: ../helpers/confirm-ios-app-link.yaml
- assertVisible: Set a new password
- assertVisible: Reset code
- assertVisible: New password
- takeScreenshot: reset-password-light
- openLink: vozzify-preview://components
- runFlow: ../helpers/confirm-ios-app-link.yaml
- scrollUntilVisible:
    element:
      id: appearance-dark
    direction: DOWN
- tapOn:
    id: appearance-dark
- scrollUntilVisible:
    element:
      id: language-pt-BR
    direction: UP
- tapOn:
    id: language-pt-BR
- openLink: vozzify-preview://forgot-password
- runFlow: ../helpers/confirm-ios-app-link.yaml
- assertVisible: Redefina sua senha
- takeScreenshot: forgot-password-dark-pt-br
- openLink: 'vozzify-preview://forgot-password/reset?email=recovery%40example.test'
- runFlow: ../helpers/confirm-ios-app-link.yaml
- assertVisible: Crie uma nova senha
- assertVisible: Código de redefinição
- assertVisible: Nova senha
- takeScreenshot: reset-password-dark-pt-br
