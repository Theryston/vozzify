name: Web image

on:
  pull_request:
    paths:
      - apps/web/**
      - packages/contracts/**
      - packages/design-tokens/**
      - apps/*/package.json
      - packages/*/package.json
      - package.json
      - nub.lock
      - .node-version
      - tsconfig.base.json
      - .github/workflows/web-image.yml
      - .github/scripts/test-web-image.sh
      - .github/scripts/deploy-coolify*
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/contracts/**
      - packages/design-tokens/**
      - apps/*/package.json
      - packages/*/package.json
      - package.json
      - nub.lock
      - .node-version
      - tsconfig.base.json
      - .github/workflows/web-image.yml
      - .github/scripts/test-web-image.sh
      - .github/scripts/deploy-coolify*

concurrency:
  group: web-image-${{ github.ref }}
  # Serialize publications through the deploy request so latest stays ordered.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: nubjs/setup-nub@v0
        if: github.event_name == 'pull_request'
        with:
          nub-version: 0.9.5

      - name: Install dependencies
        if: github.event_name == 'pull_request'
        run: nub install --frozen-lockfile

      - name: Check the web and contracts
        if: github.event_name == 'pull_request'
        run: |
          nub run lint --filter=web --filter=@vozzify/contracts
          nub run check-types --filter=web --filter=@vozzify/contracts
          nub run test:cov --filter=web
          bash .github/scripts/deploy-coolify.test.sh

      - name: Name the image
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PRs validate the container; main builds and publishes after PR checks.
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          target: runtime
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.vozzify.com
            NEXT_PUBLIC_SITE_URL=https://vozzify.com
            NEXT_PUBLIC_GTM_ENABLED=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Test the runtime image and shared cache
        if: github.event_name == 'pull_request'
        env:
          IMAGE: ${{ steps.name.outputs.image }}:${{ steps.meta.outputs.version }}
        run: bash .github/scripts/test-web-image.sh

  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Deploy the published web image to Coolify
        env:
          COOLIFY_DEPLOY_URL: ${{ secrets.WEB_COOLIFY_DEPLOY_URL }}
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: bash .github/scripts/deploy-coolify.sh
