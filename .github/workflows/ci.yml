name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4

      - uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.9.5

      - name: Install dependencies
        run: nub install --frozen-lockfile

      # apps/note-detector (Python) runs through turbo's lint and test:cov
      # tasks, which call uv. Pinned, so the runner's
      # preinstalled uv (if any) does not decide which resolver checks the
      # lock.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.32"

      - name: Lint
        run: nub run lint

      - name: Type check
        run: nub run check-types

      # Runs the unit tests and fails when coverage drops below the
      # thresholds in each app's vitest.config.ts.
      - name: Test (with coverage)
        run: nub run test:cov

      - name: Build
        run: nub run build

      # Fails when the Drizzle schema changed without a migration (or the
      # migrations are inconsistent). Nothing connects to a database: the
      # example env only satisfies the env schema drizzle.config.ts parses.
      - name: Migrations match the schema
        working-directory: apps/api
        run: |
          cp .env.example .env
          nub exec drizzle-kit check
          nub exec drizzle-kit generate
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            git status --short -- drizzle
            echo "::error::The Drizzle schema has changes with no migration. Run 'nub run db:generate' in apps/api and commit the result."
            exit 1
          fi

      # Same check for the Music catalog service's own schema. Its drizzle
      # config needs no credentials, so there is no .env to create.
      - name: Music catalog migrations match the schema
        working-directory: apps/music-catalog
        run: |
          nub exec drizzle-kit check
          nub exec drizzle-kit generate
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            git status --short -- drizzle
            echo "::error::The Music catalog Drizzle schema has changes with no migration. Run 'nub run db:generate' in apps/music-catalog and commit the result."
            exit 1
          fi

      # Unused files, exports and dependencies (config in knip.config.ts).
      - name: Dead code
        run: nub run knip

      # Copy-pasted code over 3% of the codebase (config in .jscpd.json).
      - name: Duplication
        run: nub run duplication

      # First-load JS of every prerendered page against the budget in
      # apps/web/scripts/bundle-budget.ts (needs the build above).
      - name: Web bundle budget
        working-directory: apps/web
        run: nub run bundle:check

  # The API is a public contract (the mobile app will depend on it): fail when
  # the committed openapi.json has a breaking change against the base branch.
  # The e2e suite keeps openapi.json in sync with the code.
  api-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No breaking changes in the API contract
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="origin/$BASE_REF:apps/api/openapi.json"
          if ! git cat-file -e "$base" 2>/dev/null; then
            echo "The base branch has no apps/api/openapi.json yet: nothing to compare."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/openapi"
          git show "$base" > "$RUNNER_TEMP/openapi/base.json"
          cp apps/api/openapi.json "$RUNNER_TEMP/openapi/head.json"
          docker run --rm -v "$RUNNER_TEMP/openapi:/specs" tufin/oasdiff:v1.32.1 \
            breaking /specs/base.json /specs/head.json --fail-on ERR

  # The e2e suites run in parallel jobs that share nothing but the Turbo
  # remote cache: each installs (with a warm package store) and runs one
  # suite. Together they replace a single sequential job that no longer fit
  # in one runner timeout. API and Music catalog suites start their own
  # Postgres with Testcontainers on the runner's Docker (no `services:`
  # block; see apps/api/test/setup/global-setup.ts and
  # apps/music-catalog/test/setup/global-setup.ts).
  e2e-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4

      - uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.9.5

      - name: Cache package store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: nub-store-${{ runner.os }}-${{ hashFiles('nub.lock') }}
          restore-keys: |
            nub-store-${{ runner.os }}-

      - name: Install dependencies
        run: nub install --frozen-lockfile

      # Azure's priority-1 mirror stalled while downloading ffmpeg dependencies.
      - name: Prefer Ubuntu archive mirror
        run: |
          sudo sed -i '/^http:\/\/azure\.archive\.ubuntu\.com\/ubuntu\/[[:space:]]/d' /etc/apt/apt-mirrors.txt
          grep -q '^https://archive.ubuntu.com/ubuntu/[[:space:]]' /etc/apt/apt-mirrors.txt

      # The API converts downloaded audio with ffmpeg, and e2e runs it for real.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: API e2e tests
        run: nub run test:e2e --filter=api

  e2e-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4

      - uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.9.5

      - name: Cache package store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: nub-store-${{ runner.os }}-${{ hashFiles('nub.lock') }}
          restore-keys: |
            nub-store-${{ runner.os }}-

      - name: Install dependencies
        run: nub install --frozen-lockfile

      # The Music catalog e2e suite creates the MusicBrainz schema with
      # mbslave's SQL scripts, downloaded from GitHub at the pinned tag and
      # kept in node_modules/.cache (apps/music-catalog/test/setup/
      # musicbrainz-schema.ts). Caching that folder, keyed on the tag,
      # keeps the runs from downloading them every time; bumping the tag is
      # what changes the key.
      - name: Read the pinned mbslave version
        id: mbslave
        run: |
          ref=$(sed -n "s/^const MBSLAVE_REF = '\(.*\)';$/\1/p" apps/music-catalog/test/setup/musicbrainz-schema.ts)
          if [ -z "$ref" ]; then
            echo "::error::Could not read MBSLAVE_REF from apps/music-catalog/test/setup/musicbrainz-schema.ts"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Cache the mbslave SQL scripts
        uses: actions/cache@v4
        with:
          path: apps/music-catalog/node_modules/.cache/mbslave-${{ steps.mbslave.outputs.ref }}
          key: mbslave-sql-${{ steps.mbslave.outputs.ref }}

      - name: Music catalog e2e tests
        run: nub run test:e2e --filter=music-catalog

  e2e-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4

      - uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.9.5

      - name: Cache package store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: nub-store-${{ runner.os }}-${{ hashFiles('nub.lock') }}
          restore-keys: |
            nub-store-${{ runner.os }}-

      - name: Install dependencies
        run: nub install --frozen-lockfile

      # Chromium matching the installed @playwright/test version, plus the
      # system libraries it needs on the runner. The browser download is
      # cached, keyed on the web lockfile entry; `--with-deps` still ensures
      # the system libraries.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: nub exec playwright install --with-deps chromium

      # Builds the production build the suite runs against (`web#test:e2e`
      # depends on `web#build`, usually a remote cache hit), then runs the
      # web Playwright suite. Playwright mocks the API (apps/web/e2e).
      - name: Web e2e tests
        run: nub run test:e2e --filter=web
        env:
          # Inlined into the web build: the browser needs an API URL to build
          # its auth client.
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3333

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

  # Lighthouse on a production build (assertions in
  # apps/web/lighthouserc.cjs). Uses the runner's preinstalled Chrome. It
  # builds the same `web#build` the e2e-web job makes (a remote cache hit
  # once that job uploads it, a local rebuild otherwise), so it runs in
  # parallel with the suites instead of after them.
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4

      - uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.9.5

      - name: Cache package store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: nub-store-${{ runner.os }}-${{ hashFiles('nub.lock') }}
          restore-keys: |
            nub-store-${{ runner.os }}-

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Build web
        run: nub run build --filter=web
        env:
          # Same env the e2e-web job builds with: the value is inlined and
          # part of the build hash, so this is a cache hit, not a rebuild.
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3333

      - name: Lighthouse
        working-directory: apps/web
        run: nub run lighthouse

      - name: Upload Lighthouse report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: apps/web/.lighthouseci/
          # .lighthouseci is a hidden folder, skipped by default.
          include-hidden-files: true
          retention-days: 14
