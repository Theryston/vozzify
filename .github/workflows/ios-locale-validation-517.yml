name: Temporary iOS locale UI validation

on:
  push:
    branches:
      - codex/ios-native-validation-517

permissions:
  actions: read
  contents: read

jobs:
  ios-locale-ui:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode with iOS simulator runtime
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun simctl list devices available
      - name: Download built app from native build run
        uses: actions/download-artifact@v4
        with:
          name: ios-locale-validation-517
          path: build/native-qa
          repository: ${{ github.repository }}
          run-id: 43230890703
          github-token: ${{ github.token }}
      - name: Install Maestro CLI
        run: brew install mobile-dev-inc/tap/maestro
      - name: Install app and smoke test locale selection and persistence
        # Fresh macOS XCUITest startup can exceed Maestro's 120-second default.
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "360000"
        run: |
          simulator_id="$(xcrun simctl list devices available | sed -nE 's/.*iPhone 17 \(([0-9A-F-]{36})\).*/\1/p' | head -n 1)"
          if [ -z "$simulator_id" ]; then
            echo "No iPhone 17 simulator is available on this runner" >&2
            exit 1
          fi
          echo "IOS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          if ! xcrun simctl list devices | grep -F "$simulator_id" | grep -q Booted; then
            xcrun simctl boot "$simulator_id"
          fi
          xcrun simctl bootstatus "$simulator_id" -b
          mkdir -p build/native-qa/app
          unzip -q build/native-qa/ios-locale-app.zip -d build/native-qa/app
          xcrun simctl install "$simulator_id" build/native-qa/app/Vozzify.app
          xcrun simctl launch "$simulator_id" com.vozzify.app
          maestro test apps/mobile/.maestro/ios-locale-517.yaml --test-output-dir build/native-qa/maestro-ui-retry
      - name: Capture simulator screenshot and logs
        if: always()
        run: |
          if [ -n "${IOS_SIMULATOR_ID:-}" ]; then
            xcrun simctl io "$IOS_SIMULATOR_ID" screenshot build/native-qa/ios-locale-final.png || true
            xcrun simctl spawn "$IOS_SIMULATOR_ID" log show --last 5m --style compact --predicate 'process == "Vozzify"' > build/native-qa/ios-locale.log 2>&1 || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-locale-ui-validation-517
          path: |
            build/native-qa/ios-locale-final.png
            build/native-qa/ios-locale.log
            build/native-qa/maestro-ui-retry
          if-no-files-found: warn
          retention-days: 1
