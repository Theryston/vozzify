name: Temporary iOS locale validation

on:
  push:
    branches:
      - codex/ios-native-validation-517

permissions:
  contents: read

jobs:
  ios-locale:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: http://127.0.0.1:3333
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode with iOS simulator runtime
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun simctl list devices available
      - name: Install pinned Nub CLI
        uses: nubjs/setup-nub@v0.1.0
        with:
          nub-version: 0.9.5
      - name: Install locked workspace dependencies
        run: nub install --filter=mobile... --frozen-lockfile
      - name: Install Maestro CLI
        run: brew install mobile-dev-inc/tap/maestro
      - name: Generate iOS native project
        working-directory: apps/mobile
        run: nub exec expo prebuild --clean --no-install --platform ios
      - name: Install CocoaPods dependencies
        working-directory: apps/mobile
        run: ./scripts/install-ios-pods.sh
      - name: Build and launch app in iOS Simulator
        working-directory: apps/mobile
        run: |
          simulator_id="$(xcrun simctl list devices available | sed -nE 's/.*iPhone 17 \(([0-9A-F-]{36})\).*/\1/p' | head -n 1)"
          if [ -z "$simulator_id" ]; then
            echo "No iPhone 17 simulator is available on this runner" >&2
            exit 1
          fi
          echo "IOS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          nub exec expo run:ios --configuration Release --device "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
      - name: Smoke test locale selection and persistence
        working-directory: apps/mobile
        run: maestro test .maestro/ios-locale-517.yaml --test-output-dir ios-locale-maestro-output
      - name: Capture simulator screenshot and logs
        if: always()
        working-directory: apps/mobile
        run: |
          if [ -n "${IOS_SIMULATOR_ID:-}" ]; then
            xcrun simctl io "$IOS_SIMULATOR_ID" screenshot ios-locale-final.png || true
            xcrun simctl spawn "$IOS_SIMULATOR_ID" log show --last 5m --style compact --predicate 'process == "Vozzify"' > ios-locale.log 2>&1 || true
          fi
          app_path="$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -path '*/Build/Products/Release-iphonesimulator/*.app' -print -quit)"
          if [ -n "$app_path" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$app_path" ios-locale-app.zip
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-locale-validation-517
          path: |
            apps/mobile/ios-locale-app.zip
            apps/mobile/ios-locale-final.png
            apps/mobile/ios-locale.log
            apps/mobile/ios-locale-maestro-output
          if-no-files-found: warn
          retention-days: 1
