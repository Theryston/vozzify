name: Temporary iOS appearance validation

on:
  push:
    branches:
      - codex/ios-native-validation-516

permissions:
  contents: read
  actions: read

jobs:
  ios-appearance:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: http://127.0.0.1:3333
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 360000
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode with iOS simulator runtime
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun simctl list devices available
      - name: Install pinned Nub CLI
        uses: nubjs/setup-nub@v0.1.0
        with:
          nub-version: 0.9.5
      - name: Install locked workspace dependencies
        run: nub install --filter=mobile... --frozen-lockfile
      - name: Generate iOS native project
        working-directory: apps/mobile
        run: nub exec expo prebuild --clean --no-install --platform ios
      - name: Install CocoaPods dependencies
        working-directory: apps/mobile/ios
        run: pod install
      - name: Download the previously built simulator app
        uses: actions/download-artifact@v4
        with:
          name: ios-appearance-qa
          path: ${{ runner.temp }}/previous-ios-qa
          run-id: 43237809091
          github-token: ${{ github.token }}
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Re-bundle JavaScript and exercise appearance preferences
        working-directory: apps/mobile
        run: |
          simulator_id="$(xcrun simctl list devices available | sed -nE 's/.*iPhone 17 \(([0-9A-F-]{36})\).*/\1/p' | head -n 1)"
          if [ -z "$simulator_id" ]; then
            echo "No iPhone 17 simulator is available on this runner" >&2
            exit 1
          fi
          echo "IOS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_id" || true
          xcrun simctl bootstatus "$simulator_id" -b
          app_root="$RUNNER_TEMP/ios-app/Payload"
          app_path="$app_root/Vozzify.app"
          mkdir -p "$app_root"
          unzip -q "$RUNNER_TEMP/previous-ios-qa/ios-appearance-app.zip" -d "$app_root"
          if [ ! -d "$app_path" ]; then
            echo "Expected Vozzify.app in the previous simulator artifact was not found" >&2
            exit 1
          fi
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist")"
          if [ "$bundle_id" != "com.vozzify.app" ]; then
            echo "Unexpected simulator app bundle ID: $bundle_id" >&2
            exit 1
          fi
          rm -f "$app_path/main.jsbundle"

          export PROJECT_ROOT="$PWD"
          export NODE_BINARY="$(command -v node)"
          export REACT_NATIVE_DIR="$(dirname "$(node --print "require.resolve('react-native/package.json')")")"
          export CLI_PATH="$(node --print "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })")"
          export BUNDLE_COMMAND=export:embed
          export ENTRY_FILE="$(node -e "require('expo/scripts/resolveAppEntry')" "$PROJECT_ROOT" ios absolute)"
          export CONFIGURATION=Release
          export PLATFORM_NAME=iphonesimulator
          export CONFIGURATION_BUILD_DIR="$app_root"
          export UNLOCALIZED_RESOURCES_FOLDER_PATH=Vozzify.app
          export PODS_ROOT="$PROJECT_ROOT/ios/Pods"
          export PODS_PODFILE_DIR_PATH="$PROJECT_ROOT/ios"
          export HERMES_CLI_PATH="$PODS_ROOT/hermes-engine/destroot/bin/hermesc"
          REACT_NATIVE_ROOT="$(dirname "$(node --print "require.resolve('react-native/package.json')")")"
          "$REACT_NATIVE_ROOT/scripts/react-native-xcode.sh"
          test -s "$app_path/main.jsbundle"
          codesign --force --deep --sign - "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" ios-appearance-app.zip

          xcrun simctl install "$simulator_id" "$app_path"
          xcrun simctl ui "$simulator_id" appearance light
          xcrun simctl launch "$simulator_id" com.vozzify.app
          maestro test --debug-output=maestro-debug-save-dark .maestro/appearance-save-dark.yaml
          xcrun simctl io "$simulator_id" screenshot ios-appearance-selected-dark.png
          maestro hierarchy > ios-appearance-selected-dark-hierarchy.json || true
          xcrun simctl terminate "$simulator_id" com.vozzify.app
          xcrun simctl launch "$simulator_id" com.vozzify.app
          maestro test --debug-output=maestro-debug-restored-dark .maestro/appearance-restored-dark.yaml
          xcrun simctl io "$simulator_id" screenshot ios-appearance-restored-dark.png
          maestro hierarchy > ios-appearance-restored-dark-hierarchy.json || true
          xcrun simctl ui "$simulator_id" appearance dark
          maestro test --debug-output=maestro-debug-fixed-light .maestro/appearance-fixed-light.yaml
          sleep 2
          xcrun simctl io "$simulator_id" screenshot ios-appearance-fixed-light.png
          maestro hierarchy > ios-appearance-fixed-light-hierarchy.json || true
          xcrun simctl spawn "$simulator_id" log show --last 5m --style compact --predicate 'process == "Vozzify"' > ios-appearance.log 2>&1 || true
      - name: Capture final simulator state
        if: always()
        working-directory: apps/mobile
        run: |
          if [ -z "$IOS_SIMULATOR_ID" ]; then
            echo "Simulator was not booted; no UI state to capture"
            exit 0
          fi
          xcrun simctl io "$IOS_SIMULATOR_ID" screenshot ios-appearance-final.png || true
          maestro hierarchy > ios-appearance-final-hierarchy.json 2>&1 || true
          xcrun simctl spawn "$IOS_SIMULATOR_ID" log show --last 5m --style compact --predicate 'process == "Vozzify"' > ios-appearance.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-appearance-qa
          path: |
            apps/mobile/ios-appearance-app.zip
            apps/mobile/ios-appearance-*.png
            apps/mobile/ios-appearance-*-hierarchy.json
            apps/mobile/ios-appearance.log
            apps/mobile/maestro-debug-*/**
          if-no-files-found: ignore
          retention-days: 1
